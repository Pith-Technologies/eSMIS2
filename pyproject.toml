# Host tooling (./esmis, scripts/) supports Python 3.9 and newer, because the
# macOS system interpreter is 3.9 and that is what a new contributor has. Odoo
# itself runs in Docker and has its own, newer interpreter; this bound is about
# what runs on a developer's machine.
#
# 3.11 adds tomllib. Below that, reading ~/.esmis.toml or export_config.toml
# needs the tomli backport, and each tool says so rather than failing on an
# import.
[project]
name = "esmis"
requires-python = ">=3.9"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that run external tools (deselect with '-m \"not slow\"')",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts/tests", ".git", "__pycache__", "node_modules"]
# NOTE: Don't skip B101 globally - assert statements are removed with -O flag
# and should never be used for security checks. Skip only in test files via
# the assert_used section below.

[tool.bandit.assert_used]
# Only skip assert warnings in test files where they're expected
skips = ["*/test_*.py", "*_test.py", "*/tests/*"]

# Explicitly check for hardcoded credentials
[tool.bandit.hardcoded_password_string]
# Default word list is sufficient

# Check for shell injection
[tool.bandit.shell_injection]
# Subprocess with shell=True is dangerous

[tool.coverage.run]
omit = ["*/tests/*", "*/demo/*", "*/__manifest__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
omit = ["*/tests/*", "*/demo/*", "*/__manifest__.py"]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
