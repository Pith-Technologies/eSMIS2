name: "Code Scanning - Action"

# No paths-ignore on the pull_request and push triggers: every job here is a
# required status check on 19.0, and a required check that never starts leaves
# the pull request waiting forever. Docs-only changes cost a few idle minutes
# of CI, which is the price of the gate being real.

on:
  pull_request:
    branches: ["19.0"]
  push:
    branches: ["19.0"]
  schedule:
    # Weekly: Monday at 3am UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  CodeQL-Build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
